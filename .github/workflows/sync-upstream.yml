name: Sync Upstream & Build

on:
  schedule:
    # 每8小时检查一次上游是否有更新
    - cron: "0 */8 * * *"
  workflow_dispatch:  # 手动触发也能用

permissions:
  contents: write

concurrency:
  group: sync-build
  cancel-in-progress: true

jobs:
  sync:
    name: 同步上游 + 构建推送
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远程仓库
        run: |
          git remote add upstream https://github.com/Marchen-orz/MiyoQian.git || true

      - name: 检查上游是否有更新
        id: check
        run: |
          git fetch upstream master
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/master)
          NEW_COMMITS=$(git rev-list --count "$LOCAL".."$UPSTREAM")
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ 上游无更新，跳过"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            COMMITS=$(git log --oneline "$LOCAL".."$UPSTREAM" | head -5)
            echo "上游新提交 ($NEW_COMMITS 个):"
            echo "$COMMITS"
            echo "commits<<EOF" >> "$GITHUB_OUTPUT"
            echo "$COMMITS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: 合并上游更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git merge upstream/master --no-edit

      - name: 保存我们的 Docker 配置（防止被上游覆盖）
        if: steps.check.outputs.changed == 'true'
        run: |
          # 如果上游的 Dockerfile/docker-compose/entrypoint 有变化，恢复我们的版本
          git checkout HEAD~0 -- docker/ 2>/dev/null || true

      - name: 计算新版本号
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          # 从 git tags 获取当前最新版本号（Hub 上的 tag 只有镜像推送成功后才存在，
          # 用 git tags 避免构建失败后版本号卡住不动）
          CURRENT=$(git tag --list 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          echo "当前最新版本: v${CURRENT}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "新版本号: $NEW_VERSION"

      - name: 提交版本号变更
        if: steps.check.outputs.changed == 'true'
        run: |
          git commit --allow-empty -m "chore(release): ${{ steps.version.outputs.new_version }}"

      - name: 推送到 GitHub
        if: steps.check.outputs.changed == 'true'
        run: git push origin master

      - name: 设置 Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: zhu822560687
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 构建并推送镜像
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            zhu822560687/miyoqian:latest
            zhu822560687/miyoqian:${{ steps.version.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打 Git Tag（镜像推送成功后）
        if: steps.check.outputs.changed == 'true'
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}
