# -*- coding: utf-8 -*-
# 本镜像的默认配置（首次启动时由 entrypoint 复制到 /app/state/config.yaml）。
#
# 与上游 config.example.yaml 的差别只有两处，都为了「开箱即用」：
#   1. 验证码渠道默认走【自定义接口】，指向本机/局域网自建的 gt-solver；
#   2. 米游币社区任务默认打开。
# 上游的 config.example.yaml 保持原样不动。
#
# gt-solver 默认地址用 host.docker.internal，需要在 compose 里加：
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
# 如果 gt-solver 和本容器在同一个 docker 网络里，也可以直接改成 http://gt-solver:10721/custom

enable: true

accounts:
  []
# 账号凭据（cookie、stoken、云游戏 tokens 等）存储在 data/credentials.yaml 中

storage:
  data_dir: data
  credentials_file: credentials.yaml
  log_dir: logs
  log_file: miyouqian.log

# 设备档案：全部留空即可，首次运行时自动生成，之后由程序维护。
device:
  id: ""
  fp: ""
  name: ""
  model: ""

features:
  game_checkin: true
  cloud_game_checkin: false
  bbs_tasks: true

captcha:
  max_retries: 5
  channels:
    # 自建 gt-solver：本地视觉模型识别，识别不出时由 gt-solver 内部决定是否降级打码狗
    - provider: custom
      enable: true
      url: "http://host.docker.internal:10721/custom"
      api_key: ""      # gt-solver 不校验，留空即可
      timeout: 120
    # 兜底打码狗：用 gt-solver 时一般不需要，gt-solver 内部已有降级逻辑
    - provider: damagou
      enable: false
      userkey: ""
      timeout: 60

schedule:
  enable: true
  time: "09:00"
  jitter_minutes: 45
  run_on_start: false

web:
  host: "0.0.0.0"     # 容器内必须监听 0.0.0.0，否则宿主机访问不到
  port: 5890
  password: ""        # 留空则首次访问时由页面设置（至少 8 位）

games:
  enabled:
    - genshin
    - starrail
    - zzz
  black_list:
    genshin: []
    starrail: []
    zzz: []

cloud_games:
  enabled:
    - genshin
    - zzz

bbs:
  forums:
    - 5
    - 2
  checkin: true
  read: true
  like: true
  share: true
  cancel_like: true
  post_limit: 5
  delay_seconds:
    - 1
    - 3

push:
  error_only: false
  channels:
    - provider: pushplus
      enable: false
      token: ""
      topic: ""
    - provider: qqbot
      enable: false
      app_id: ""
      client_secret: ""
      user_openid: ""
      group_openid: ""
      message_format: text
      api_base: ""
    - provider: gotify
      enable: false
      server: ""
      token: ""
      priority: 5
    - provider: meow
      enable: false
      nickname: ""

shop_exchange:
  enable: true
  retry_seconds: 20
  retry_interval: 0.4
  push: true
  plans: []
